name: farah
description: تطبيق فرح لحجز قاعات الأفراح في ليبيا
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "icon.png"
  min_sdk_android: 21
adaptive_icon_background: "#1A237E"
adaptive_icon_foreground: "icon.png"
